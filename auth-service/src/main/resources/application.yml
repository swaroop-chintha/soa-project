server:
  port: ${PORT:8084}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

auth:
  users:
    admin:
      password: ${AUTH_ADMIN_PASSWORD:admin123}
    user:
      password: ${AUTH_USER_PASSWORD:user123}

jwt:
  secret: ${JWT_SECRET:d41d8cd98f00b204e9800998ecf8427e_aegis_secure_jwt_secret_key_2026_spring_boot_3_3_4}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8084/login/oauth2/code/google}



eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9000/eureka/}
    registry-fetch-interval-seconds: 3
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%X{correlationId:-NO_CORR}] [%thread] %logger{36} : %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.aegis.auth: ${LOG_LEVEL_APP:INFO}
