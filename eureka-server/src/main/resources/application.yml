server:
  port: ${PORT:9000}

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    response-cache-update-interval-ms: 1000
    eviction-interval-timer-in-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%X{correlationId:-NO_CORR}] [%thread] %logger{36} : %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.netflix.eureka: ${LOG_LEVEL_EUREKA:INFO}
